let TOKEN="";
async function api(method,path,body){
  const r=await fetch("/api"+path,{method,headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:body?JSON.stringify(body):undefined});
  const d=await r.json(); if(!r.ok)throw new Error(d.error||"Error"); return d;

// ── UI HELPERS ──
function Spinner(){return <div style={{display:"flex",justifyContent:"center",padding:40}}><div style={{width:36,height:36,border:"3px solid #e2e8f0",borderTop:"3px solid #006847",borderRadius:"50%",animation:"spin .7s linear infinite"}}/></div>;}

function Badge({color,children}){
  const c={green:{bg:"#d1fae5",tx:"#065f46"},red:{bg:"#fee2e2",tx:"#991b1b"},blue:{bg:"#dbeafe",tx:"#1e40af"},yellow:{bg:"#fef9c3",tx:"#854d0e"},gray:{bg:"#f1f5f9",tx:"#475569"},teal:{bg:"#ccfbf1",tx:"#065f46"},orange:{bg:"#ffedd5",tx:"#9a3412"},purple:{bg:"#ede9fe",tx:"#5b21b6"}};
  const s=c[color]||c.gray;
  return <span style={{padding:"2px 9px",borderRadius:20,fontSize:11,fontWeight:700,display:"inline-block",background:s.bg,color:s.tx,whiteSpace:"nowrap"}}>{children}</span>;
}

function Alert({type,msg}){
  if(!msg)return null;
  const s={ok:{bg:"#d1fae5",tx:"#065f46",ic:"✅"},err:{bg:"#fee2e2",tx:"#991b1b",ic:"❌"},warn:{bg:"#fef9c3",tx:"#854d0e",ic:"⚠️"}};
  const x=s[type]||s.err;
  return <div style={{background:x.bg,color:x.tx,padding:"10px 14px",borderRadius:9,fontSize:13,marginBottom:12,display:"flex",alignItems:"center",gap:8}}><span>{x.ic}</span><span>{msg}</span></div>;
}

function Modal({title,onClose,children,width=580}){
  useEffect(()=>{document.body.style.overflow="hidden";return()=>{document.body.style.overflow="";};},[]);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.65)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:12}} onClick={onClose}>
      <div className="fade-in" style={{background:"white",borderRadius:16,width:"100%",maxWidth:width,maxHeight:"94vh",overflowY:"auto",boxShadow:"0 24px 60px rgba(0,0,0,.35)"}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:"14px 18px",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:"white",zIndex:1,borderRadius:"16px 16px 0 0"}}>
          <span style={{fontWeight:700,fontSize:14,color:"#0f172a"}}>{title}</span>
          <button onClick={onClose} style={{border:"none",background:"#f1f5f9",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:18,color:"#64748b",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        <div style={{padding:"16px 18px"}}>{children}</div>
      </div>
    </div>
  );
}

// ── DASHBOARD DETAIL MODAL ──

  const [expanded,setExpanded]=useState(null);
  return(
    <Modal title={title} onClose={onClose} width={560}>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {data.map(({label,value,sub,icon,students})=>(
          <div key={label}>
            <div onClick={()=>students&&setExpanded(expanded===label?null:label)}
              style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:"#f8fafc",borderRadius:10,border:"1px solid #e2e8f0",cursor:students?"pointer":"default"}}
              onMouseEnter={e=>{if(students)e.currentTarget.style.background="#f0fdf4";}}
              onMouseLeave={e=>{if(students)e.currentTarget.style.background="#f8fafc";}}>
              {icon&&<span style={{fontSize:22,flexShrink:0}}>{icon}</span>}
              <div style={{flex:1}}>
                <div style={{fontSize:12,color:"#64748b",fontWeight:600}}>{label}</div>
                {sub&&<div style={{fontSize:11,color:"#94a3b8",marginTop:1}}>{sub}</div>}
                {students&&<div style={{fontSize:10,color:"#006847",marginTop:2}}>Toca para ver alumnas {expanded===label?"▲":"▼"}</div>}
              </div>
              <div style={{fontSize:20,fontWeight:800,color}}>{value}</div>
            </div>
            {expanded===label&&students&&(
              <div style={{background:"white",border:"1px solid #e2e8f0",borderTop:"none",borderRadius:"0 0 10px 10px",padding:"8px 14px"}}>
                {students.map((s,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:"1px solid #f1f5f9",fontSize:12}}>
                    <div style={{width:24,height:24,borderRadius:"50%",background:"#fee2e2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#dc2626",flexShrink:0}}>{s.nombres?.[0]}{s.apPaterno?.[0]}</div>
                    <div style={{flex:1}}><span style={{fontWeight:600,color:"#1e293b"}}>{s.nombres} {s.apPaterno}</span><span style={{color:"#94a3b8",marginLeft:6,fontSize:11}}>{s.descGrado} {s.curso}</span></div>
                    <div style={{fontSize:10,fontWeight:700,color:"#dc2626"}}>{(s.nivelMatricula==="P"?"PB":"EB")+"-"+String(s.matricula).padStart(4,"0")}</div>

              </div>
            )}
          </div>
        ))}
      </div>
    </Modal>
  );
}

// ── BAJA MODAL ──
function BajaModal({student,onClose,onConfirm}){
  const [motivo,setMotivo]=useState("");
  const [motivoCustom,setMotivoCustom]=useState("");
  const [fecha,setFecha]=useState(today());
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const inp={width:"100%",padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:9,fontSize:14,outline:"none",boxSizing:"border-box"};
  const sel={...inp,appearance:"none",WebkitAppearance:"none"};
  async function submit(){
    const motivoFinal=motivo==="Otro motivo"?motivoCustom:motivo;
    if(!motivoFinal)return setErr("Selecciona o escribe el motivo de baja");
    if(!fecha)return setErr("Indica la fecha de baja");
    setLoading(true);setErr("");
    try{ await onConfirm(motivoFinal,fecha); onClose(); }
    catch(e){ setErr(e.message); }
    setLoading(false);
  }
  return(
    <Modal title="🚫 Registrar Baja" onClose={onClose} width={480}>
      <div style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:10,padding:"12px 14px",marginBottom:16,display:"flex",gap:10,alignItems:"center"}}>
        <span style={{fontSize:24}}>⚠️</span>
        <div>
          <div style={{fontWeight:700,fontSize:14,color:"#9a3412"}}>{student.nombres} {student.apPaterno}</div>
          <div style={{fontSize:12,color:"#c2410c"}}>Matrícula {formatMat(student)} · {student.descGrado} {student.curso}</div>
        </div>
      </div>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",marginBottom:5}}>Motivo de baja *</label>
        <select style={sel} value={motivo} onChange={e=>setMotivo(e.target.value)}>
          <option value="">Seleccionar motivo…</option>
          {MOTIVOS_BAJA.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </div>
      {motivo==="Otro motivo"&&(
        <div style={{marginBottom:12}}>
          <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",marginBottom:5}}>Especificar motivo *</label>
          <input style={inp} value={motivoCustom} onChange={e=>setMotivoCustom(e.target.value)} placeholder="Describe el motivo…"/>
        </div>
      )}
      <div style={{marginBottom:16}}>
        <label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",marginBottom:5}}>Fecha de baja *</label>
        <input style={inp} type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
      </div>
      <Alert type="err" msg={err}/>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={onClose} style={{padding:"9px 18px",border:"1.5px solid #e2e8f0",borderRadius:10,background:"white",cursor:"pointer",fontWeight:600,fontSize:13}}>Cancelar</button>
        <button onClick={submit} disabled={loading} style={{padding:"9px 18px",border:"none",borderRadius:10,background:"#dc2626",color:"white",cursor:"pointer",fontWeight:700,fontSize:13}}>{loading?"Registrando…":"Confirmar Baja"}</button>
      </div>
    </Modal>
  );
}

  const [saving,setSaving]=useState(false);

  const sel={...inp,appearance:"none",WebkitAppearance:"none"};

  async function saveEdits(){
    setSaving(true);setErr("");
    try{
      const r=await api("PATCH",`/students/${student.id}/update`,form);
      onUpdate(r);setEditing(false);setMsg("✅ Datos guardados correctamente");
    }catch(e){setErr(e.message);}
    setSaving(false);
  }

        </div>
      );
    }
    return(
      <div style={{marginBottom:11}}>
        <div style={{fontSize:10.5,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>{label}</div>

    <>

      <div style={{background:editing?"#eff6ff":pre?"#fffbeb":"#f0fdf4",borderRadius:12,padding:"14px 16px",marginBottom:14,display:"flex",gap:12,alignItems:"flex-start",flexWrap:"wrap",border:editing?"2px solid #3b82f6":"none"}}>
        <div style={{width:52,height:52,borderRadius:"50%",background:editing?"#3b82f6":V,display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,fontWeight:800,color:"white",flexShrink:0}}>{student.nombres?.[0]}{student.apPaterno?.[0]}</div>

          <div style={{fontWeight:700,fontSize:15}}>{student.nombres} {student.apPaterno} {student.apMaterno}</div>

          <div style={{marginTop:7,display:"flex",gap:5,flexWrap:"wrap"}}>
            <Badge color={pre?"yellow":"teal"}>{formatMat(student)}</Badge>
            <Badge color="green">{student.descGrado} {student.curso}</Badge>
            <Badge color={act?"green":"red"}>{act?"Activa":"Baja"}</Badge>
            {editing&&<Badge color="blue">Modo edición activo</Badge>}
          </div>
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0,flexWrap:"wrap"}}>
          {!editing&&<button onClick={()=>doPrint(student)} style={{padding:"7px 12px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:9,cursor:"pointer",fontSize:12,fontWeight:700,color:"#475569"}}>🖨️</button>}

                <div>
                  <div style={{fontSize:11,color:"#64748b",marginBottom:3}}>Fecha</div>
                  <input type="date" style={{width:"100%",padding:"7px 10px",border:"1.5px solid #fca5a5",borderRadius:8,fontSize:13,outline:"none"}}
                    value={form.fechaBaja||form.fechaRetiro||""} onChange={e=>setForm(f=>({...f,fechaBaja:e.target.value,fechaRetiro:e.target.value}))}/>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))",gap:"0 20px"}}>
        {/* Campos no editables */}
        <div style={{marginBottom:11}}>
          <div style={{fontSize:10.5,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>N° Matrícula</div>
          <div style={{fontSize:13.5,color:"#1e293b",borderBottom:"1px solid #f1f5f9",paddingBottom:5}}>{formatMat(student)}</div>
        </div>
        <div style={{marginBottom:11}}>
          <div style={{fontSize:10.5,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>RUN</div>
          <div style={{fontSize:13.5,color:"#1e293b",borderBottom:"1px solid #f1f5f9",paddingBottom:5}}>{fmtRun(student.run,student.dv)}</div>
        </div>
        <div style={{marginBottom:11}}>
          <div style={{fontSize:10.5,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>Edad</div>
          <div style={{fontSize:13.5,color:"#1e293b",borderBottom:"1px solid #f1f5f9",paddingBottom:5}}>{calcAge(student.fechaNac)} años</div>
        </div>
        {/* Campos editables */}
        <EditField label="Nombres" field="nombres"/>
        <EditField label="Apellido Paterno" field="apPaterno"/>
        <EditField label="Apellido Materno" field="apMaterno"/>
        <EditField label="Fecha Nacimiento" field="fechaNac" type="date"/>
        <EditField label="Género" field="genero">
          {editing&&<select style={sel} value={form.genero||""} onChange={e=>setForm(f=>({...f,genero:e.target.value}))}><option value="F">Femenino</option><option value="M">Masculino</option></select>}
        </EditField>
        <EditField label="Etnia" field="codEtnia">
          {editing&&<select style={sel} value={form.codEtnia||"0"} onChange={e=>setForm(f=>({...f,codEtnia:e.target.value}))}>{Object.entries(ETNIAS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select>}
        </EditField>
        <EditField label="Nivel" field="descGrado">
          {editing&&<select style={sel} value={form.descGrado||""} onChange={e=>setForm(f=>({...f,descGrado:e.target.value,nivelMatricula:PRE.includes(e.target.value)?"P":"B",codEnsenanza:PRE.includes(e.target.value)?"10":"110"}))}><optgroup label="Pre-Básica">{PRE.map(g=><option key={g} value={g}>{g}</option>)}</optgroup><optgroup label="Básica">{GRADES.filter(g=>!PRE.includes(g)).map(g=><option key={g} value={g}>{g}</option>)}</optgroup></select>}
        </EditField>
        <EditField label="Curso" field="curso">
          {editing&&<select style={sel} value={form.curso||""} onChange={e=>setForm(f=>({...f,curso:e.target.value}))}>{["A","B","C","D"].map(l=><option key={l} value={l}>{l}</option>)}</select>}
        </EditField>
        <EditField label="Dirección" field="direccion"/>
        <EditField label="Comuna" field="comuna"/>
        <EditField label="Email / Correo Apoderado" field="email" type="email"/>
        <EditField label="Teléfono / Celular" field="celular"/>
        <EditField label="Incorporación" field="fechaIngreso" type="date"/>
      </div>

      {(role==="admin"||role==="operador")&&act&&!editing&&(
        <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid #f1f5f9"}}>
          <button onClick={()=>setShowBaja(true)} style={{padding:"8px 16px",background:"#fee2e2",color:"#991b1b",border:"1.5px solid #fca5a5",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13}}>🚫 Dar de baja</button>
        </div>
      )}
    </Modal>
    {showBaja&&<BajaModal student={student} onClose={()=>setShowBaja(false)}
      onConfirm={async(motivo,fecha)=>{ const updated=await api("PATCH",`/students/${student.id}/baja`,{motivo,fechaBaja:fecha}); onBaja(updated); onClose(); }}/>}
    </>
  );
}

// ── ENROLL FORM ──
function EnrollForm({onClose,onSave,nextPre,nextBas}){
  const V="#006847";
  const [form,setForm]=useState({anio:"2026",rbd:"6762",codEnsenanza:"110",descGrado:"1° básico",curso:"A",run:"",dv:"",genero:"F",nombres:"",apPaterno:"",apMaterno:"",direccion:"",comuna:"VALDIVIA",codComuna:"14101",email:"",telefono:"",celular:"",fechaNac:"",codEtnia:"0",fechaIngreso:today(),fechaRetiro:"1900-01-01"});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const [err,setErr]=useState("");const [ld,setLd]=useState(false);
  const pre=PRE.includes(form.descGrado);
  const nextNum=pre?nextPre:nextBas;
  const matCode=(pre?"PB":"EB")+"-"+String(nextNum).padStart(4,"0");
  function hg(g){set("descGrado",g);set("codEnsenanza",PRE.includes(g)?"10":"110");set("nivelMatricula",PRE.includes(g)?"P":"B");}
  const inp={width:"100%",padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:9,fontSize:14,outline:"none",boxSizing:"border-box"};
  const sel={...inp,appearance:"none",WebkitAppearance:"none"};
  function FG({label,req,children}){return <div style={{marginBottom:12}}><label style={{display:"block",fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",marginBottom:4}}>{label}{req&&<span style={{color:"#dc2626",marginLeft:2}}>*</span>}</label>{children}</div>;}
  async function submit(){
    if(!form.nombres.trim())return setErr("Nombre obligatorio");
    if(!form.apPaterno.trim())return setErr("Apellido paterno obligatorio");
    if(!form.run.trim())return setErr("RUN obligatorio");
    setErr("");setLd(true);
    try{const r=await api("POST","/students",{...form,nivelMatricula:pre?"P":"B"});onSave(r);}
    catch(e){setErr(e.message);}
    setLd(false);
  }
  return(
    <Modal title="📋 Nueva Matrícula" onClose={onClose} width={700}>
      <div style={{background:pre?"#fffbeb":"#f0fdf4",border:`1.5px solid ${pre?"#fde68a":"#bbf7d0"}`,borderRadius:10,padding:"11px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontSize:22}}>{pre?"🟡":"🟢"}</span>
        <div><div style={{fontSize:12,color:"#475569",fontWeight:600}}>{pre?"Pre-Básica":"Educación General Básica"}</div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:2}}><span style={{fontSize:12,color:"#64748b"}}>Matrícula asignada:</span><span style={{fontSize:19,fontWeight:800,color:pre?"#854d0e":V}}>{matCode}</span></div></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:"0 18px"}}>
        <FG label="RUN" req><input style={inp} value={form.run} onChange={e=>set("run",e.target.value)} placeholder="27536915"/></FG>
        <FG label="Dígito Verificador" req><input style={inp} value={form.dv} onChange={e=>set("dv",e.target.value)} maxLength={1} placeholder="2"/></FG>
        <FG label="Nombres" req><input style={inp} value={form.nombres} onChange={e=>set("nombres",e.target.value.toUpperCase())}/></FG>
        <FG label="Apellido Paterno" req><input style={inp} value={form.apPaterno} onChange={e=>set("apPaterno",e.target.value.toUpperCase())}/></FG>
        <FG label="Apellido Materno"><input style={inp} value={form.apMaterno} onChange={e=>set("apMaterno",e.target.value.toUpperCase())}/></FG>
        <FG label="Género"><select style={sel} value={form.genero} onChange={e=>set("genero",e.target.value)}><option value="F">Femenino</option><option value="M">Masculino</option></select></FG>
        <FG label="Fecha de Nacimiento" req><input style={inp} type="date" value={form.fechaNac} onChange={e=>set("fechaNac",e.target.value)}/></FG>
        <FG label="Etnia"><select style={sel} value={form.codEtnia} onChange={e=>set("codEtnia",e.target.value)}>{Object.entries(ETNIAS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></FG>
        <FG label="Nivel / Grado" req>
          <select style={{...sel,borderColor:pre?"#fbbf24":"#34d399"}} value={form.descGrado} onChange={e=>hg(e.target.value)}>
            <optgroup label="── Pre-Básica ──">{PRE.map(g=><option key={g} value={g}>{g}</option>)}</optgroup>
            <optgroup label="── Educación Básica ──">{GRADES.filter(g=>!PRE.includes(g)).map(g=><option key={g} value={g}>{g}</option>)}</optgroup>
          </select>
        </FG>
        <FG label="Curso"><select style={sel} value={form.curso} onChange={e=>set("curso",e.target.value)}>{["A","B","C","D"].map(l=><option key={l} value={l}>{l}</option>)}</select></FG>
        <FG label="Dirección"><input style={inp} value={form.direccion} onChange={e=>set("direccion",e.target.value)} placeholder="Calle N°"/></FG>
        <FG label="Comuna"><input style={inp} value={form.comuna} onChange={e=>set("comuna",e.target.value)}/></FG>
        <FG label="Email"><input style={inp} type="email" value={form.email} onChange={e=>set("email",e.target.value)}/></FG>
        <FG label="Celular"><input style={inp} value={form.celular} onChange={e=>set("celular",e.target.value)} placeholder="+56 9 XXXX XXXX"/></FG>
        <FG label="Fecha Incorporación" req><input style={inp} type="date" value={form.fechaIngreso} onChange={e=>set("fechaIngreso",e.target.value)}/></FG>
        <FG label="Año Escolar"><input style={inp} value={form.anio} onChange={e=>set("anio",e.target.value)}/></FG>
      </div>
      <Alert type="err" msg={err}/>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8,flexWrap:"wrap"}}>
        <button onClick={onClose} style={{padding:"10px 18px",border:"1.5px solid #e2e8f0",borderRadius:10,background:"white",cursor:"pointer",fontWeight:600,fontSize:14}}>Cancelar</button>
        <button onClick={submit} disabled={ld} style={{padding:"10px 20px",border:"none",borderRadius:10,background:V,color:"white",cursor:"pointer",fontWeight:700,fontSize:14}}>{ld?"Guardando…":"✅ Registrar "+matCode}</button>
      </div>
    </Modal>
  );
}

// ── USER MANAGER ──
function UserManager({onClose}){
  const V="#006847";
  const [users,setUsers]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [changePwdId,setChangePwdId]=useState(null);
  const [newPwd,setNewPwd]=useState("");
  const [newU,setNewU]=useState({name:"",username:"",password:"",role:"operador"});
  const [err,setErr]=useState("");const [msg,setMsg]=useState("");const [ld,setLd]=useState(false);
  const rl={admin:"Administrador",operador:"Operador (alta/baja)",docente:"Solo lectura"};
  const rc={admin:"red",operador:"yellow",docente:"gray"};
  const inp={width:"100%",padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:9,fontSize:13,outline:"none",boxSizing:"border-box"};
  useEffect(()=>{api("GET","/users").then(setUsers).catch(e=>setErr(e.message));},[]);
  async function addUser(){
    if(!newU.name||!newU.username||!newU.password)return setErr("Todos los campos requeridos");
    if(newU.password.length<4)return setErr("Contraseña mínimo 4 caracteres");
    setLd(true);setErr("");
    try{const u=await api("POST","/users",newU);setUsers(p=>[...p,u]);setMsg("✅ Usuario creado");setShowNew(false);setNewU({name:"",username:"",password:"",role:"operador"});}
    catch(e){setErr(e.message);}setLd(false);
  }
  async function toggle(id){
    try{const u=await api("PATCH",`/users/${id}/toggle`);setUsers(p=>p.map(x=>x.id===id?u:x));setMsg("✅ Estado actualizado");}
    catch(e){setErr(e.message);}
  }
  async function deleteUser(id,name){
    if(!window.confirm(`¿Eliminar definitivamente al usuario "${name}"? Esta acción no se puede deshacer.`))return;
    try{await api("DELETE",`/users/${id}`);setUsers(p=>p.filter(x=>x.id!==id));setMsg("✅ Usuario eliminado");}
    catch(e){setErr(e.message);}
  }
  async function changePassword(id){
    if(!newPwd||newPwd.length<4)return setErr("Contraseña mínimo 4 caracteres");
    setLd(true);setErr("");
    try{await api("PATCH",`/users/${id}/password`,{password:newPwd});setMsg("✅ Contraseña actualizada");setChangePwdId(null);setNewPwd("");}
    catch(e){setErr(e.message);}setLd(false);
  }
  return(
    <Modal title="⚙️ Gestión de Usuarios" onClose={onClose} width={640}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <span style={{fontSize:13,color:"#64748b"}}>{users?`${users.length} usuarios`:"Cargando…"}</span>
        <button onClick={()=>setShowNew(v=>!v)} style={{padding:"7px 14px",background:V,color:"white",border:"none",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13}}>＋ Nuevo usuario</button>
      </div>
      <Alert type="ok" msg={msg}/><Alert type="err" msg={err}/>
      {showNew&&(
        <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:12,padding:"14px",marginBottom:12}}>
          <div style={{fontWeight:700,color:"#065f46",fontSize:13,marginBottom:10}}>Crear nuevo usuario</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:"10px 14px"}}>
            {[["Nombre","name","text"],["Usuario","username","text"],["Contraseña","password","password"]].map(([l,k,t])=>(
              <div key={k}><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:3,textTransform:"uppercase"}}>{l}</label>
              <input style={inp} type={t} value={newU[k]} onChange={e=>setNewU(u=>({...u,[k]:e.target.value}))}/></div>
            ))}
            <div><label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:3,textTransform:"uppercase"}}>Rol</label>
              <select style={{...inp,appearance:"none"}} value={newU.role} onChange={e=>setNewU(u=>({...u,role:e.target.value}))}>
                <option value="operador">Operador (alta/baja)</option>
                <option value="docente">Solo lectura</option>
              </select>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end"}}>
            <button onClick={()=>{setShowNew(false);setErr("");}} style={{padding:"7px 14px",border:"1.5px solid #e2e8f0",borderRadius:8,background:"white",cursor:"pointer",fontSize:13}}>Cancelar</button>
            <button onClick={addUser} disabled={ld} style={{padding:"7px 14px",border:"none",borderRadius:8,background:V,color:"white",cursor:"pointer",fontWeight:700,fontSize:13}}>{ld?"...":"Crear"}</button>
          </div>
        </div>
      )}
      {!users?<Spinner/>:(
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {users.map(u=>(
            <div key={u.id} style={{background:u.active?"#f8fafc":"#fff5f5",borderRadius:12,border:`1.5px solid ${u.active?"#e2e8f0":"#fca5a5"}`,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 13px",flexWrap:"wrap"}}>
                <div style={{width:36,height:36,borderRadius:"50%",background:u.active?"#006847":"#dc2626",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"white",flexShrink:0}}>{u.name[0]}</div>
                <div style={{flex:1,minWidth:120}}>
                  <div style={{fontWeight:700,fontSize:13.5,color:u.active?"#0f172a":"#9ca3af"}}>{u.name}</div>
                  <div style={{fontSize:11.5,color:"#94a3b8"}}>@{u.username} · <Badge color={rc[u.role]}>{rl[u.role]}</Badge></div>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button onClick={()=>setChangePwdId(changePwdId===u.id?null:u.id)} style={{padding:"5px 11px",border:"1.5px solid #3b82f6",borderRadius:8,background:"white",cursor:"pointer",fontSize:12,fontWeight:700,color:"#3b82f6"}}>🔑 Contraseña</button>
                  {u.id!==1&&<button onClick={()=>toggle(u.id)} style={{padding:"5px 11px",border:`1.5px solid ${u.active?"#fca5a5":"#86efac"}`,borderRadius:8,background:"white",cursor:"pointer",fontSize:12,fontWeight:700,color:u.active?"#dc2626":"#16a34a"}}>{u.active?"Desactivar":"Activar"}</button>}
                  {u.id!==1&&<button onClick={()=>deleteUser(u.id,u.name)} style={{padding:"5px 11px",border:"1.5px solid #fca5a5",borderRadius:8,background:"#fee2e2",cursor:"pointer",fontSize:12,fontWeight:700,color:"#dc2626"}}>🗑️ Eliminar</button>}
                </div>
              </div>
              {changePwdId===u.id&&(
                <div style={{padding:"10px 13px",background:"#eff6ff",borderTop:"1px solid #bfdbfe",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="Nueva contraseña (mín. 4 caracteres)" style={{...inp,flex:1,minWidth:180,background:"white"}}/>
                  <button onClick={()=>changePassword(u.id)} disabled={ld} style={{padding:"8px 14px",border:"none",borderRadius:8,background:"#3b82f6",color:"white",cursor:"pointer",fontWeight:700,fontSize:13,whiteSpace:"nowrap"}}>{ld?"...":"Cambiar"}</button>
                  <button onClick={()=>{setChangePwdId(null);setNewPwd("");}} style={{padding:"8px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,background:"white",cursor:"pointer",fontSize:13}}>✕</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </Modal>
  );
}

// ── LOGIN ──
function Login({onLogin}){
  const [u,setU]=useState("");const [p,setP]=useState("");const [err,setErr]=useState("");const [ld,setLd]=useState(false);
  const V="#006847";
  async function go(){if(!u||!p)return setErr("Ingresa usuario y contraseña");setLd(true);setErr("");try{const d=await api("POST","/login",{username:u,password:p});TOKEN=d.token;onLogin(d.user);}catch(e){setErr(e.message);}setLd(false);}
  const inp={width:"100%",padding:"12px 14px",border:"2px solid #e2e8f0",borderRadius:10,fontSize:15,outline:"none"};
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#003d28 0%,#006847 60%,#003d28 100%)",padding:16}}>
      <div className="fade-in" style={{background:"white",borderRadius:20,padding:"30px 26px",width:"100%",maxWidth:400,boxShadow:"0 32px 80px rgba(0,0,0,.4)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <img src={LOGO} alt="Logo" style={{width:90,height:90,objectFit:"contain",borderRadius:"50%",border:`3px solid ${V}`,padding:3}}/>
          <div style={{fontSize:18,fontWeight:800,color:V,marginTop:10}}>{SCHOOL.name}</div>
          <div style={{fontSize:12,color:"#64748b",marginTop:2}}>RBD {SCHOOL.rbd} · {SCHOOL.city}</div>
          <div style={{fontSize:11.5,color:"#94a3b8",marginTop:1}}>Sistema de Matrícula {SCHOOL.year}</div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase"}}>Usuario</label>
          <input value={u} onChange={e=>setU(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} style={inp} placeholder="usuario" autoComplete="username"/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:5,textTransform:"uppercase"}}>Contraseña</label>
          <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} style={inp} placeholder="••••••••" autoComplete="current-password"/>
        </div>
        <Alert type="err" msg={err}/>
        <button onClick={go} disabled={ld} style={{width:"100%",padding:13,background:V,color:"white",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer"}}>{ld?"Verificando…":"Ingresar"}</button>
      </div>
    </div>
  );
}


// ── PROYECCIÓN 2027 ──
function Proyeccion({students}){
  const V="#006847";
  const activos=students.filter(isActive);
  const bajas=students.filter(s=>!isActive(s));
  const tasaBaja=students.length>0?bajas.length/students.length:0;

  // Octavo básico 2026 - estos egresan, no se cuentan en 2027
  const octavos2026 = activos.filter(s=>s.descGrado==="8° básico").length;

  // Por nivel: calcular riesgo y proyección
  const cursosRiesgo=GRADES.map(g=>{
    const total=students.filter(s=>s.descGrado===g).length;
    const act=activos.filter(s=>s.descGrado===g).length;
    const baj=bajas.filter(s=>s.descGrado===g).length;
    if(total===0)return null;
    const tasa=total>0?baj/total:0;
    // 8° básico egresa en 2027 → proyección 0
    const egresa=g==="8° básico";
    const proj2027=egresa?0:Math.round(act*(1-tasa));
    return{grade:g,total,activos:act,bajas:baj,tasa,proj2027,egresa,riesgo:egresa?"egresa":tasa>0.15?"alto":tasa>0.08?"medio":"bajo"};
  }).filter(Boolean);

  const total2026=activos.length;
  const total2027=cursosRiesgo.reduce((a,c)=>a+c.proj2027,0);
  const diff=total2027-total2026;

  const riesgoColor={alto:"#dc2626",medio:"#f59e0b",bajo:"#16a34a",egresa:"#6366f1"};
  const riesgoBg={alto:"#fee2e2",medio:"#fef9c3",bajo:"#d1fae5",egresa:"#ede9fe"};

  // Motivos de baja
  const motivos={};
  bajas.forEach(s=>{if(s.motivoBaja){motivos[s.motivoBaja]=(motivos[s.motivoBaja]||0)+1;}});
  const motivosList=Object.entries(motivos).sort((a,b)=>b[1]-a[1]);

  return(
    <div className="fade-in">
      <div style={{marginBottom:18}}>
        <h1 style={{fontSize:20,fontWeight:800,color:"#0f172a"}}>Proyección 2027</h1>
        <div style={{color:"#64748b",fontSize:13,marginTop:1}}>Análisis estadístico · Las alumnas de 8° básico 2026 egresan y no se proyectan</div>
      </div>

      {/* Resumen 4 tarjetas */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:20}}>
        {[
          {label:"Matrícula 2026",value:total2026,color:V,icon:"👥",sub:"Alumnas activas"},
          {label:"Egresan (8° básico)",value:octavos2026,color:"#6366f1",icon:"🎓",sub:"No se proyectan"},
          {label:"Proyección 2027",value:total2027,color:"#3b82f6",icon:"📈",sub:"Estimado próximo año"},
          {label:"Variación",value:`${diff>=0?"+":""}${diff}`,color:diff>=0?"#16a34a":"#dc2626",icon:diff>=0?"📈":"📉",sub:`${Math.round(Math.abs(diff)/total2026*100)}% del total`},
        ].map(({label,value,color,icon,sub})=>(
          <div key={label} style={{background:"white",borderRadius:14,padding:"15px 17px",boxShadow:"0 2px 12px rgba(0,0,0,.06)",borderLeft:`4px solid ${color}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:10.5,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".05em"}}>{label}</div>
                <div style={{fontSize:24,fontWeight:800,color,marginTop:3,lineHeight:1}}>{value}</div>
                <div style={{fontSize:10.5,color:"#94a3b8",marginTop:3}}>{sub}</div>
              </div>
              <div style={{fontSize:20,background:`${color}18`,borderRadius:10,padding:"7px 9px"}}>{icon}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:16,marginBottom:16}}>
        {/* Tabla comparativa */}
        <div style={{background:"white",borderRadius:14,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.06)"}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:"#0f172a"}}>📊 Comparativa por Nivel</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead><tr style={{borderBottom:"2px solid #f1f5f9",background:"#f8fafc"}}>
                <th style={{textAlign:"left",padding:"7px 8px",color:"#64748b",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>Nivel</th>
                <th style={{textAlign:"center",padding:"7px 4px",color:"#64748b",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>2026</th>
                <th style={{textAlign:"center",padding:"7px 4px",color:"#64748b",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>2027</th>
                <th style={{textAlign:"center",padding:"7px 4px",color:"#64748b",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>Var.</th>
                <th style={{textAlign:"center",padding:"7px 4px",color:"#64748b",fontWeight:700,fontSize:10.5,textTransform:"uppercase"}}>Estado</th>
              </tr></thead>
              <tbody>
                {cursosRiesgo.map(c=>{
                  const d=c.proj2027-c.activos;
                  return(
                    <tr key={c.grade} style={{borderBottom:"1px solid #f8fafc",background:c.egresa?"#faf5ff":"transparent"}}>
                      <td style={{padding:"7px 8px",fontSize:11.5,color:"#334155"}}>{c.grade.length>22?c.grade.slice(0,22)+"…":c.grade}</td>
                      <td style={{padding:"7px 4px",textAlign:"center",fontWeight:700,color:V}}>{c.activos}</td>
                      <td style={{padding:"7px 4px",textAlign:"center",fontWeight:700,color:c.egresa?"#6366f1":"#3b82f6"}}>{c.egresa?"—":c.proj2027}</td>
                      <td style={{padding:"7px 4px",textAlign:"center",fontWeight:700,color:c.egresa?"#6366f1":d>=0?"#16a34a":"#dc2626"}}>{c.egresa?"Egresa":d>=0?"+"+d:d}</td>
                      <td style={{padding:"7px 4px",textAlign:"center"}}>
                        <span style={{background:riesgoBg[c.riesgo],color:riesgoColor[c.riesgo],padding:"2px 7px",borderRadius:20,fontSize:10,fontWeight:700}}>
                          {c.riesgo==="alto"?"🔴 Alto":c.riesgo==="medio"?"🟡 Medio":c.riesgo==="egresa"?"🎓 Egresa":"🟢 Bajo"}
                        </span>
                      </td>
                    </tr>
                  );
                })}
                {/* FILA TOTALES */}
                <tr style={{borderTop:"2.5px solid #e2e8f0",background:"#f8fafc"}}>
                  <td style={{padding:"9px 8px",fontWeight:800,fontSize:13,color:"#0f172a"}}>TOTAL GENERAL</td>
                  <td style={{padding:"9px 4px",textAlign:"center",fontWeight:800,fontSize:14,color:V}}>{total2026}</td>
                  <td style={{padding:"9px 4px",textAlign:"center",fontWeight:800,fontSize:14,color:"#3b82f6"}}>{total2027}</td>
                  <td style={{padding:"9px 4px",textAlign:"center",fontWeight:800,fontSize:14,color:diff>=0?"#16a34a":"#dc2626"}}>{diff>=0?"+":""}{diff}</td>
                  <td style={{padding:"9px 4px",textAlign:"center"}}><span style={{background:"#f1f5f9",color:"#475569",padding:"2px 7px",borderRadius:20,fontSize:10,fontWeight:700}}>{Math.round((1-tasaBaja)*100)}% ret.</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        {/* Cursos en riesgo */}
        <div style={{background:"white",borderRadius:14,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.06)"}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:"#0f172a"}}>⚠️ Cursos con mayor riesgo</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {cursosRiesgo.filter(c=>!c.egresa).sort((a,b)=>b.tasa-a.tasa).slice(0,7).map(c=>(
              <div key={c.grade} style={{padding:"10px 12px",background:riesgoBg[c.riesgo],borderRadius:10,border:`1px solid ${riesgoColor[c.riesgo]}30`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#1e293b",flex:1}}>{c.grade}</div>
                  <span style={{background:riesgoColor[c.riesgo],color:"white",padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:700}}>
                    {c.riesgo==="alto"?"🔴 Alto":c.riesgo==="medio"?"🟡 Medio":"🟢 Bajo"}
                  </span>
                </div>
                <div style={{display:"flex",gap:12,marginTop:5,fontSize:12,color:"#475569",flexWrap:"wrap"}}>
                  <span>Bajas: <strong>{c.bajas}</strong></span>
                  <span>Tasa: <strong>{Math.round(c.tasa*100)}%</strong></span>
                  <span>Proyección 2027: <strong style={{color:riesgoColor[c.riesgo]}}>{c.proj2027}</strong></span>
                </div>
              </div>
            ))}
            {/* Egresadas */}
            <div style={{padding:"10px 12px",background:"#ede9fe",borderRadius:10,border:"1px solid #c4b5fd30"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:4}}>
                <div style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>8° básico — Egresan 2026</div>
                <span style={{background:"#6366f1",color:"white",padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:700}}>🎓 Egresa</span>
              </div>
              <div style={{fontSize:12,color:"#475569",marginTop:5}}>{octavos2026} alumnas egresan y no se incluyen en proyección 2027</div>
            </div>
          </div>
        </div>
      </div>

      {/* Motivos de baja */}
      {motivosList.length>0&&(
        <div style={{background:"white",borderRadius:14,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.06)",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:12,color:"#0f172a"}}>📋 Motivos de baja registrados</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:8}}>
            {motivosList.map(([motivo,n])=>(
              <div key={motivo} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"#f8fafc",borderRadius:10,border:"1px solid #e2e8f0"}}>
                <div style={{flex:1,fontSize:13,color:"#334155",fontWeight:600}}>{motivo}</div>
                <div style={{fontWeight:800,fontSize:16,color:"#dc2626"}}>{n}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:12,padding:"12px 16px",fontSize:12,color:"#065f46",lineHeight:1.7}}>
        <strong>📌 Metodología:</strong> Proyección basada en tasa de retención 2026 por nivel. Las alumnas de 8° básico egresan y se excluyen de la proyección 2027. Riesgo alto &gt;15% de bajas, medio 8-15%, bajo &lt;8%.
      </div>
    </div>
  );
}
// ── MAIN APP ──
function App(){
  const [auth,setAuth]=useState(null);
  const [students,setStudents]=useState(null);
  const [search,setSearch]=useState("");
  const [filterGrade,setFilterGrade]=useState("Todos");
  const [filterCurso,setFilterCurso]=useState("Todos");
  const [filterStatus,setFilterStatus]=useState("activas");
  const [filterNivel,setFilterNivel]=useState("Todos");
  const [view,setView]=useState("dashboard");
  const [dashTab,setDashTab]=useState("resumen");
  const [selected,setSelected]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [showUsers,setShowUsers]=useState(false);
  const [newlyEnrolled,setNewlyEnrolled]=useState(null);
  const [detailModal,setDetailModal]=useState(null);
  const V="#006847";const Y="#F4C300";

  const [dashStats,setDashStats]=useState(null);
  useEffect(()=>{
    if(auth){
      api("GET","/students").then(setStudents).catch(console.error);
      api("GET","/stats").then(setDashStats).catch(console.error);
      // Actualizar dashboard cada 60 segundos
      const interval = setInterval(()=>{
        api("GET","/stats").then(setDashStats).catch(console.error);
      }, 60000);
      return ()=>clearInterval(interval);
    }
  },[auth]);

  const nextPre=useMemo(()=>students?Math.max(...students.filter(isPreBasica).map(s=>s.matricula||0),0)+1:1,[students]);
  const nextBas=useMemo(()=>students?Math.max(...students.filter(s=>!isPreBasica(s)).map(s=>s.matricula||0),0)+1:1,[students]);

  const uniqueGrades=useMemo(()=>{
    if(!students)return["Todos"];
    const a=["Todos"];GRADES.forEach(g=>{if(students.some(s=>s.descGrado===g))a.push(g);});return a;
  },[students]);

  const uniqueCursos=useMemo(()=>{
    if(!students)return["Todos"];
    const b=students.filter(s=>(filterGrade==="Todos"||s.descGrado===filterGrade)&&(filterNivel==="Todos"||(filterNivel==="pre"&&isPreBasica(s))||(filterNivel==="bas"&&!isPreBasica(s))));
    return["Todos",...[...new Set(b.map(s=>s.curso))].sort()];
  },[students,filterGrade,filterNivel]);

  const filtered=useMemo(()=>{
    if(!students)return[];
    const q=search.toLowerCase();
    return students.filter(s=>{
      const act=isActive(s);const pre=isPreBasica(s);
      return(filterStatus==="todas"||(filterStatus==="activas"&&act)||(filterStatus==="baja"&&!act))
        &&(!q||`${s.nombres} ${s.apPaterno} ${s.apMaterno} ${s.run} ${formatMat(s)}`.toLowerCase().includes(q))
        &&(filterGrade==="Todos"||s.descGrado===filterGrade)
        &&(filterCurso==="Todos"||s.curso===filterCurso)
        &&(filterNivel==="Todos"||(filterNivel==="pre"&&pre)||(filterNivel==="bas"&&!pre));
    }).sort((a,b)=>{
      // Siempre ordenar por: nivel SIGE → curso → posición SIGE
      const GRADES_IDX=["1er nivel de Transición (Pre-kinder)","2° nivel de Transición (Kinder)","1° básico","2° básico","3° básico","4° básico","5° básico","6° básico","7° básico","8° básico"];
      const ga=GRADES_IDX.indexOf(a.descGrado), gb=GRADES_IDX.indexOf(b.descGrado);
      if(ga!==gb)return ga-gb;
      const ca=(a.curso||"").localeCompare(b.curso||"");
      if(ca!==0)return ca;
      const pa=(a.posicionSige||999), pb=(b.posicionSige||999);
      if(pa!==pb)return pa-pb;
      return (a.apPaterno||"").localeCompare(b.apPaterno||"","es");
    });
  },[students,search,filterGrade,filterCurso,filterStatus,filterNivel]);

  const stats=useMemo(()=>{
    if(!students)return{};
    const act=students.filter(isActive);
    const byG={};GRADES.forEach(g=>{const n=act.filter(s=>s.descGrado===g).length;if(n)byG[g]=n;});
    return{total:act.length,bajas:students.length-act.length,byGrade:byG,
      totalPre:act.filter(isPreBasica).length,totalBas:act.filter(s=>!isPreBasica(s)).length,
      ultimaPre:Math.max(...students.filter(isPreBasica).map(s=>s.matricula||0),0),
      ultimaBas:Math.max(...students.filter(s=>!isPreBasica(s)).map(s=>s.matricula||0),0),
      cursos:[...new Set(act.map(s=>`${s.descGrado}|${s.curso}`))].length};
  },[students]);

  if(!auth)return <Login onLogin={setAuth}/>;
  const canEnroll=auth.role==="admin"||auth.role==="operador";
  const isAdmin=auth.role==="admin";

  function NavBtn({id,icon,label}){

  }

  function TabBtn({id,label,tab,setTab}){
    return <button onClick={()=>setTab(id)} style={{padding:"8px 16px",border:"none",borderBottom:`2px solid ${tab===id?V:"transparent"}`,background:"transparent",cursor:"pointer",fontWeight:tab===id?700:500,fontSize:13.5,color:tab===id?V:"#64748b",transition:".15s"}}>{label}</button>;
  }

  return(
    <div style={{minHeight:"100vh",background:"#f1f5f9"}}>
      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#006847 0%,#004d34 100%)",color:"white",position:"sticky",top:0,zIndex:200,boxShadow:"0 4px 20px rgba(0,0,0,.25)"}}>
        <div style={{maxWidth:1300,margin:"0 auto",padding:"0 12px",display:"flex",alignItems:"center",gap:10,height:56}}>
          <img src={LOGO} alt="Logo" style={{width:36,height:36,borderRadius:"50%",background:"white",padding:2,objectFit:"contain",flexShrink:0}}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13.5,fontWeight:800,lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{SCHOOL.name}</div>
            <div style={{fontSize:10,opacity:.7}}>RBD {SCHOOL.rbd} · {SCHOOL.year}</div>
          </div>
          <nav style={{display:"flex",gap:2}}>
            <NavBtn id="dashboard" icon="📊" label="Dashboard"/>
            <NavBtn id="students" icon="👥" label="Alumnos"/>
            {isAdmin&&<NavBtn id="reports" icon="📈" label="Reportes"/>}
          </nav>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            {canEnroll&&<button onClick={()=>setShowNew(true)} style={{padding:"6px 11px",background:"rgba(244,195,0,.9)",color:"#1a1a1a",border:"none",borderRadius:8,fontSize:12,fontWeight:800,cursor:"pointer",whiteSpace:"nowrap"}}>＋ Matr.</button>}
            {isAdmin&&<button onClick={(e)=>{e.stopPropagation();setShowUsers(true);}} style={{padding:"6px 12px",background:"rgba(255,255,255,.18)",color:"white",border:"1.5px solid rgba(255,255,255,.35)",borderRadius:8,fontSize:12,cursor:"pointer",fontWeight:600,display:"flex",alignItems:"center",gap:4}}>⚙️ <span className="hide-mobile">Usuarios</span></button>}
            <button onClick={()=>{if(window.confirm("¿Cerrar sesión?")){{TOKEN="";setAuth(null);setStudents(null);}};}} style={{padding:"6px 11px",background:"rgba(220,38,38,.7)",border:"none",color:"white",borderRadius:8,fontSize:12,cursor:"pointer",fontWeight:600}}>Salir</button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1300,margin:"0 auto",padding:"20px 12px"}}>

        {/* DASHBOARD */}
        {view==="dashboard"&&(
          <div className="fade-in">
            <div style={{marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
              <div>
                <h1 style={{fontSize:20,fontWeight:800,color:"#0f172a"}}>Dashboard · {SCHOOL.year}</h1>

              <TabBtn id="proyeccion" label="📈 Proyección 2027" tab={dashTab} setTab={setDashTab}/>
            </div>

            {dashTab==="resumen"&&(!students?<Spinner/>:(
              <>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:12,marginBottom:18}}>
                  <StatCard label="Total Activos" value={stats.total} sub={`Toca para detalle`} color={V} icon="👥"
                    onClick={()=>setDetailModal({title:"👥 Desglose Total Activos",color:V,data:[
                      {label:"Pre-Básica activos",value:stats.totalPre,icon:"🟡",sub:"Pre-Kinder y Kinder"},

                  <StatCard label="Básica" value={stats.totalBas} sub={`Última: EB-${String(stats.ultimaBas).padStart(4,"0")}`} color="#3b82f6" icon="🟢"

                </div>
                {/* Panel Últimas Altas y Bajas */}

                        <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:"#0f172a",display:"flex",alignItems:"center",gap:8}}>✅ Últimas Altas <span style={{fontSize:11,fontWeight:500,color:"#64748b"}}>(recientes)</span></div>
                        {dashStats.ultimasAltas.map((s,i)=>(
                          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #f1f5f9"}}>
                            <div style={{width:28,height:28,borderRadius:"50%",background:"#d1fae5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#065f46",flexShrink:0}}>{s.nombres?.[0]}{s.apPaterno?.[0]}</div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:12.5,fontWeight:600,color:"#1e293b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.nombres} {s.apPaterno}</div>
                              <div style={{fontSize:11,color:"#64748b"}}>{s.descGrado} {s.curso}</div>
                            </div>
                            <div style={{textAlign:"right",flexShrink:0}}>
                              <div style={{fontSize:11,fontWeight:700,color:"#006847"}}>{(s.nivelMatricula==="P"?"PB":"EB")+"-"+String(s.matricula).padStart(4,"0")}</div>
                              <div style={{fontSize:10,color:"#94a3b8"}}>{s.fechaIngreso?s.fechaIngreso.split("-").reverse().join("/"):"—"}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                    {dashStats.ultimasBajas?.length>0&&(
                      <div style={{background:"white",borderRadius:14,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.06)",borderTop:"3px solid #dc2626"}}>
                        <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:"#0f172a",display:"flex",alignItems:"center",gap:8}}>🚫 Últimas Bajas <span style={{fontSize:11,fontWeight:500,color:"#64748b"}}>(recientes)</span></div>
                        {dashStats.ultimasBajas.map((s,i)=>(
                          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #f1f5f9"}}>
                            <div style={{width:28,height:28,borderRadius:"50%",background:"#fee2e2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#dc2626",flexShrink:0}}>{s.nombres?.[0]}{s.apPaterno?.[0]}</div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:12.5,fontWeight:600,color:"#1e293b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.nombres} {s.apPaterno}</div>
                              <div style={{fontSize:11,color:"#64748b"}}>{s.descGrado} {s.curso}</div>
                              <div style={{fontSize:11,color:"#dc2626",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.motivoBaja||"Sin motivo registrado"}</div>
                            </div>
                            <div style={{textAlign:"right",flexShrink:0}}>
                              <div style={{fontSize:11,fontWeight:700,color:"#dc2626"}}>{(s.nivelMatricula==="P"?"PB":"EB")+"-"+String(s.matricula).padStart(4,"0")}</div>
                              <div style={{fontSize:10,color:"#94a3b8"}}>{(s.fechaBaja||s.fechaRetiro||"").split("-").reverse().join("/")}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:16}}>
                  {[["pre","🟡 Pre-Básica","#f59e0b","yellow","ultimaPre","totalPre"],["bas","🟢 Educación Básica","#3b82f6","blue","ultimaBas","totalBas"]].map(([nivel,title,color,badge,ulk,totk])=>(
                    <div key={nivel} style={{background:"white",borderRadius:14,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.06)",borderTop:`3px solid ${color}`}}>
                      <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:"#0f172a",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                        {title}<Badge color={badge}>{nivel==="pre"?"PB":"EB"}-0001 → {nivel==="pre"?"PB":"EB"}-{String(stats[ulk]).padStart(4,"0")}</Badge>
                      </div>
                      {Object.entries(stats.byGrade).filter(([g])=>nivel==="pre"?PRE.includes(g):!PRE.includes(g)).map(([g,n])=>(
                        <div key={g} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                          <div style={{fontSize:12,color:"#475569",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g}</div>
                          <div style={{width:70,background:"#f1f5f9",borderRadius:20,height:7,flexShrink:0}}><div style={{width:`${Math.round(n/(stats[totk]||1)*100)}%`,background:color,borderRadius:20,height:"100%"}}></div></div>
                          <div style={{fontSize:13,fontWeight:700,color,width:24,textAlign:"right"}}>{n}</div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </>
            ))}

            {dashTab==="proyeccion"&&(!students?<Spinner/>:<Proyeccion students={students}/>)}
          </div>
        )}

        {/* ALUMNOS */}
        {view==="students"&&(
          <div className="fade-in">
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
              <div>
                <h1 style={{fontSize:19,fontWeight:800,color:"#0f172a"}}>Nómina de Alumnos</h1>
                <div style={{fontSize:12.5,color:"#64748b",marginTop:1}}>{filtered.length} alumno{filtered.length!==1?"s":""} encontrado{filtered.length!==1?"s":""}</div>
              </div>
              {canEnroll&&<button onClick={()=>setShowNew(true)} style={{padding:"9px 16px",background:V,color:"white",border:"none",borderRadius:10,fontSize:13.5,fontWeight:700,cursor:"pointer"}}>＋ Nueva Matrícula</button>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              <div style={{gridColumn:"1/-1"}}><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Nombre, RUN o N° matrícula…" style={{width:"100%",padding:"10px 13px",border:"1.5px solid #e2e8f0",borderRadius:10,fontSize:13.5,outline:"none",background:"white"}}/></div>
              <select value={filterNivel} onChange={e=>{setFilterNivel(e.target.value);setFilterGrade("Todos");setFilterCurso("Todos");}} style={{padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:10,fontSize:13,outline:"none",background:"white"}}>
                <option value="Todos">Todos los niveles</option><option value="pre">🟡 Pre-Básica</option><option value="bas">🟢 Básica</option>
              </select>
              <select value={filterGrade} onChange={e=>{setFilterGrade(e.target.value);setFilterCurso("Todos");}} style={{padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:10,fontSize:13,outline:"none",background:"white"}}>
                {uniqueGrades.filter(g=>filterNivel==="Todos"||g==="Todos"||(filterNivel==="pre"&&PRE.includes(g))||(filterNivel==="bas"&&!PRE.includes(g))).map(g=><option key={g} value={g}>{g}</option>)}
              </select>
              <select value={filterCurso} onChange={e=>setFilterCurso(e.target.value)} style={{padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:10,fontSize:13,outline:"none",background:"white"}}>
                {uniqueCursos.map(c=><option key={c} value={c}>Curso {c}</option>)}
              </select>
              <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{padding:"9px 11px",border:"1.5px solid #e2e8f0",borderRadius:10,fontSize:13,outline:"none",background:"white"}}>
                <option value="activas">Solo activas</option><option value="baja">Solo bajas</option><option value="todas">Todas</option>
              </select>
              {(search||filterGrade!=="Todos"||filterCurso!=="Todos"||filterStatus!=="activas"||filterNivel!=="Todos")&&
                <button onClick={()=>{setSearch("");setFilterGrade("Todos");setFilterCurso("Todos");setFilterStatus("activas");setFilterNivel("Todos");}} style={{padding:"9px 13px",border:"1.5px solid #e2e8f0",borderRadius:10,background:"white",cursor:"pointer",fontSize:13,color:"#64748b",fontWeight:600}}>✕</button>}
            </div>
            {!students?<Spinner/>:(
              <div style={{background:"white",borderRadius:14,boxShadow:"0 2px 12px rgba(0,0,0,.06)",overflow:"hidden"}}>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                      {["#","N° Matr.","RUN","Nombre (Orden SIGE)","Nivel","Cur.","Estado",""].map(h=><th key={h} style={{padding:"10px 11px",textAlign:h==="#"||h===""?"center":"left",fontWeight:700,color:"#64748b",fontSize:10.5,textTransform:"uppercase",letterSpacing:".04em",whiteSpace:"nowrap"}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {filtered.slice(0,300).map((s,i)=>{
                        const act=isActive(s);const pre=isPreBasica(s);
                        return(
                          <tr key={s.id||i} style={{borderBottom:"1px solid #f1f5f9",background:act?"transparent":"#fff8f8"}}
                            onMouseEnter={e=>e.currentTarget.style.background=act?"#f8fafc":"#fff0f0"}
                            onMouseLeave={e=>e.currentTarget.style.background=act?"transparent":"#fff8f8"}>
                            <td style={{padding:"9px 8px",textAlign:"center",color:"#94a3b8",fontSize:11,fontWeight:600}}>{i+1}</td>
                            <td style={{padding:"9px 11px"}}><span style={{fontWeight:800,color:pre?"#854d0e":V,fontSize:12,background:pre?"#fef9c3":"#d1fae5",padding:"2px 7px",borderRadius:6}}>{formatMat(s)}</span></td>
                            <td style={{padding:"9px 11px",fontFamily:"monospace",color:"#64748b",fontSize:11.5}}>{fmtRun(s.run,s.dv)}</td>
                            <td style={{padding:"9px 11px"}}>
                              <div style={{display:"flex",alignItems:"center",gap:8}}>
                                <div style={{width:28,height:28,borderRadius:"50%",background:act?`${V}18`:"#fee2e2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:act?V:"#dc2626",flexShrink:0}}>{s.apPaterno?.[0]}{s.nombres?.[0]}</div>
                                <div>
                                  <div style={{fontWeight:600,color:"#1e293b",fontSize:13,textTransform:"capitalize"}}>{(s.apPaterno||"").toLowerCase()} {(s.apMaterno||"").toLowerCase()} {(s.nombres||"").toLowerCase()}</div>
                                </div>
                              </div>
                            </td>
                            <td style={{padding:"9px 11px",color:"#475569",maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:12}}>{s.descGrado}</td>
                            <td style={{padding:"9px 11px"}}><Badge color="green">{s.curso}</Badge></td>
                            <td style={{padding:"9px 11px"}}>
                              <div>
                                <Badge color={act?"green":"red"}>{act?"Activa":"Baja"}</Badge>
                                {!act&&s.motivoBaja&&<div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{s.motivoBaja.slice(0,22)}{s.motivoBaja.length>22?"…":""}</div>}
                              </div>
                            </td>
                            <td style={{padding:"9px 11px",textAlign:"center"}}>
                              <div style={{display:"flex",gap:5,justifyContent:"center"}}>
                                <button onClick={()=>setSelected(s)} style={{padding:"4px 10px",background:`${V}18`,color:V,border:"none",borderRadius:6,fontSize:12,fontWeight:700,cursor:"pointer"}}>Ver</button>
                                <button onClick={()=>doPrint(s)} style={{padding:"4px 8px",background:"#f1f5f9",color:"#475569",border:"none",borderRadius:6,fontSize:12,cursor:"pointer"}}>🖨️</button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                      {filtered.length===0&&<tr><td colSpan={7} style={{padding:"36px",textAlign:"center",color:"#94a3b8"}}>No se encontraron alumnos</td></tr>}
                    </tbody>
                  </table>
                </div>
                {filtered.length>300&&<div style={{padding:"10px",background:"#fef9c3",fontSize:12,color:"#854d0e",textAlign:"center"}}>Mostrando 300 de {filtered.length}. Afine la búsqueda.</div>}
              </div>
            )}
          </div>
        )}

        {/* REPORTES */}
        {view==="reports"&&isAdmin&&(
          <div className="fade-in">
            <h1 style={{fontSize:19,fontWeight:800,color:"#0f172a",marginBottom:16}}>Reportes por Curso</h1>
            {!students?<Spinner/>:["pre","bas"].map(nivel=>(
              <div key={nivel} style={{marginBottom:20}}>
                <div style={{fontSize:14,fontWeight:700,color:"#0f172a",marginBottom:10,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  {nivel==="pre"?"🟡 Pre-Básica":"🟢 Educación Básica"}
                  <Badge color={nivel==="pre"?"yellow":"blue"}>{nivel==="pre"?`PB-0001 → PB-${String(stats.ultimaPre).padStart(4,"0")}`:`EB-0001 → EB-${String(stats.ultimaBas).padStart(4,"0")}`}</Badge>
                </div>
                <div style={{display:"grid",gap:10}}>
                  {GRADES.filter(g=>nivel==="pre"?PRE.includes(g):!PRE.includes(g)).filter(g=>students.some(s=>s.descGrado===g)).map(g=>{
                    const gAct=students.filter(s=>s.descGrado===g&&isActive(s)).sort((a,b)=>{const ap=a.apPaterno?.localeCompare(b.apPaterno,"es",{sensitivity:"base"});if(ap!==0)return ap;return a.apMaterno?.localeCompare(b.apMaterno,"es",{sensitivity:"base"});});
                    const gBaj=students.filter(s=>s.descGrado===g&&!isActive(s));
                    const cursos=[...new Set(students.filter(s=>s.descGrado===g).map(s=>s.curso))].sort();
                    return(
                      <div key={g} style={{background:"white",borderRadius:12,padding:"13px 16px",boxShadow:"0 2px 8px rgba(0,0,0,.05)"}}>
                        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:10}}>
                          <div style={{flex:1,minWidth:180,fontWeight:700,fontSize:14,color:"#0f172a"}}>{g}</div>
                          <Badge color={nivel==="pre"?"yellow":"blue"}>{gAct.length} activos</Badge>
                          {gBaj.length>0&&<Badge color="red">{gBaj.length} bajas</Badge>}
                        </div>
                        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                          {cursos.map(c=>{
                            const n=gAct.filter(s=>s.curso===c).length;
                            return <button key={c} onClick={()=>{setFilterNivel(nivel);setFilterGrade(g);setFilterCurso(c);setFilterStatus("activas");setView("students");}} style={{padding:"6px 13px",background:"#f8fafc",border:"1.5px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,color:"#334155",display:"flex",alignItems:"center",gap:6}}>
                              <Badge color="green">{c}</Badge><span>{n}</span>
                            </button>;
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* MODALS */}
      {detailModal&&<DashboardDetail title={detailModal.title} data={detailModal.data} color={detailModal.color} onClose={()=>setDetailModal(null)}/>}
      {selected&&<StudentDetail student={selected} onClose={()=>setSelected(null)} role={auth.role}
        onUpdate={updated=>setStudents(p=>p.map(s=>s.id===updated.id?updated:s))}
        onBaja={updated=>{setStudents(p=>p.map(s=>s.id===updated.id?updated:s));api("GET","/stats").then(setDashStats).catch(console.error);}}/>}
      {showNew&&canEnroll&&<EnrollForm onClose={()=>setShowNew(false)} nextPre={nextPre} nextBas={nextBas}
        onSave={s=>{setStudents(p=>[...p,s]);setShowNew(false);setNewlyEnrolled(s);}}/>}
      {newlyEnrolled&&<PrintModal student={newlyEnrolled} onClose={()=>setNewlyEnrolled(null)}/>}
      {showUsers&&isAdmin&&<UserManager onClose={()=>setShowUsers(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
